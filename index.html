<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>alvraMusic</title>
<style>
:root{--bg:#3a1a78;--bg2:#24104d;--scr:#2d1f3e;--sel:#3c4f8a;--ink:#fff;--mute:#b9a9d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(120% 80% at 50% 0,#5a35a8,var(--bg) 45%,var(--bg2));color:var(--ink);font-family:Georgia,"Times New Roman",serif;display:flex;justify-content:center;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#app{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;padding:18px 14px 12px;gap:14px}
#screen{flex:1;min-height:0;position:relative;background:var(--scr);border:3px solid #0d0814;border-radius:34px;box-shadow:0 0 0 2px #4a3a66 inset,0 18px 40px #0008;overflow:hidden;display:flex;flex-direction:column}
#top{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 8px}
#ttl{font-size:28px;font-weight:700;min-width:0}#logo{height:22px;width:auto;display:block}
.pill{border:2px solid #6b5a88;border-radius:30px;padding:6px 16px;font-weight:700;font-size:20px;background:#ffffff10}
#pills{display:flex;gap:8px}
#body{flex:1;min-height:0;overflow:hidden;position:relative;padding:6px 12px}
#inp{display:none;gap:8px;margin:2px 0 10px}
#inp input{flex:1;min-width:0;background:#00000040;border:2px solid #6b5a88;border-radius:16px;color:#fff;font:inherit;font-size:16px;padding:10px 14px}
#inp button{background:var(--sel);border:0;border-radius:16px;color:#fff;font:inherit;font-weight:700;padding:0 16px}
#list{position:relative}
.it{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;margin:6px 0;border-radius:24px;font-size:26px;font-weight:700;border:2px solid transparent;cursor:pointer;transition:background .15s,margin .2s}
.it small{display:block;font-size:14px;font-weight:400;color:var(--mute);margin-top:2px}
.it .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it.on{background:linear-gradient(#46598f,#34457a);border-color:#5b6fae;box-shadow:0 4px 14px #0006}
.it.sub{font-size:19px;padding:10px 16px}
.chev{opacity:.6;font-size:24px;margin-left:10px}
#arc{position:absolute;right:6px;top:0;bottom:0;width:60px;pointer-events:none}
#np{display:none;text-align:center;padding:4px 6px}
#np img{width:100%;max-width:300px;aspect-ratio:1;object-fit:cover;border-radius:22px;box-shadow:0 12px 30px #0008;background:#00000040}
#np h2{margin:14px 0 2px;font-size:24px}#np p{margin:0;color:var(--mute);font-size:17px}
.msg{color:var(--mute);padding:14px 20px;font-size:17px;line-height:1.4}
#ytbox{position:absolute;left:-9999px;top:0;width:240px;height:135px}
#mini{margin:0 12px 12px;border:2px solid #4d3d6a;border-radius:24px;background:#ffffff0c;padding:10px 12px 14px;display:flex;align-items:center;gap:12px;position:relative}
#mini img{width:54px;height:54px;border-radius:10px;object-fit:cover;background:#00000050}
#mm{flex:1;min-width:0}
#mt,#ma{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mt{font-size:19px;font-weight:700}#ma{font-size:15px;color:var(--mute)}
.ib{background:none;border:0;color:#fff;font-size:26px;padding:4px 8px;cursor:pointer}
#bar{position:absolute;left:14px;right:14px;bottom:6px;height:3px;background:#ffffff30;border-radius:2px}
#fill{height:100%;width:0;background:#fff;border-radius:2px}
#deck{position:relative;height:290px;flex:none;display:flex;align-items:center;justify-content:center}
#ring{position:relative;width:272px;height:272px;border-radius:50%;background:radial-gradient(circle,#3d2278,#2b1560);border:2px solid #5a45900;box-shadow:0 0 0 2px #ffffff14 inset,0 10px 30px #0006;touch-action:none;user-select:none}
#ring b,#ring button{position:absolute;color:#fff;background:none;border:0;font-size:24px;cursor:pointer}
#bm{top:30px;left:50%;transform:translateX(-50%);font-size:19px;letter-spacing:.12em;font-family:system-ui,sans-serif;font-weight:800;color:#c9b8ee}
#bp{left:26px;top:50%;transform:translateY(-50%)}#bn{right:26px;top:50%;transform:translateY(-50%)}
#bpp{bottom:24px;left:50%;transform:translateX(-50%)}
#ctr{position:absolute;left:50%;top:50%;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;background:#4a2f8a;border:2px solid #7a63b4;cursor:pointer}
#pw{position:absolute;right:6px;top:2px;width:48px;height:48px;border-radius:50%;background:#ffffff10;border:2px solid #5a4690;color:#c9b8ee;font-size:22px;cursor:pointer}
button:focus-visible,.it:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
#boot{position:fixed;inset:0;z-index:99;background:radial-gradient(120% 80% at 50% 0,#5a35a8,#3a1a78 45%,#24104d);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .6s}#boot img{width:64%;max-width:300px;animation:pop 1s ease-out both}@keyframes pop{from{opacity:0;transform:scale(.85);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}#boot small{color:#c9b8ee;font-family:system-ui,sans-serif;font-size:14px;opacity:0;transition:opacity .3s}#boot.tap small{opacity:1}@media(prefers-reduced-motion:reduce){#boot img{animation:none}}
</style></head><body>

<script>
const $=s=>document.getElementById(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let queue=store.get('pq',[]),cur=-1,key=store.get('pk',''),results=[],stack=['menu'],sel=0,player=null,ready=false,playing=false,pending=null;
const thumb=id=>'https://i.ytimg.com/vi/'+id+'/mqdefault.jpg';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- YouTube ---------- */
const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);
window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('yt',{width:240,height:135,playerVars:Object.assign({playsinline:1,controls:0,rel:0},/^http/.test(location.origin)?{origin:location.origin}:{}),events:{onReady:()=>{ready=true;if(pending!==null){play(pending);pending=null}},onStateChange:e=>{playing=e.data===1;$('mp').textContent=playing?'⏸':'▶';if(e.data===0)next(1)}}})};
function play(i){if(!queue.length)return;cur=(i+queue.length)%queue.length;const t=queue[cur];
 if(!ready){pending=cur;return}
 player.loadVideoById(t.id);paint();}
function next(d){clk();if(queue.length)play(cur<0?0:cur+d)}
function toggle(){clk();if(!ready)return;if(cur<0){play(0);return}playing?player.pauseVideo():player.playVideo()}
function paint(){ms();const t=queue[cur];$('mt').textContent=t?t.title:'Nothing playing';$('ma').textContent=t?t.author:'Open Online to add songs';
 $('mi').src=t?thumb(t.id):'';$('art').src=t?thumb(t.id).replace('mqdefault','hqdefault'):'';$('nt').textContent=t?t.title:'Nothing playing';$('na').textContent=t?t.author:'';}
setInterval(()=>{if(ready&&player.getDuration&&playing){const d=player.getDuration()||1;$('fill').style.width=(player.getCurrentTime()/d*100)+'%'}},500);
function parseId(u){try{const x=new URL(u);if(x.hostname==='youtu.be')return x.pathname.slice(1);return x.searchParams.get('v')}catch(e){return null}}
async function addByLink(u){const id=parseId(u);if(!id)return false;let title='YouTube track',author='YouTube Music';
 try{const r=await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent('https://www.youtube.com/watch?v='+id));const j=await r.json();title=j.title;author=j.author_name.replace(/ - Topic$/,'')}catch(e){}
 addTrack({id,title,author});return true}
function addTrack(t){if(!queue.some(x=>x.id===t.id)){queue.push(t);store.set('pq',queue)}play(queue.findIndex(x=>x.id===t.id))}
async function search(q){const tk0=await token();if(!key&&!tk0){results=[];msg('Sign in to YouTube in Settings, or paste a link.');return}
 try{const r=await fetch('https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoCategoryId=10&maxResults=12&q='+encodeURIComponent(q)+(tk0?'':'&key='+encodeURIComponent(key)),tk0?{headers:{Authorization:'Bearer '+tk0}}:{});const j=await r.json();
  if(j.error){msg('Search failed: '+j.error.message);return}
  const d=document.createElement('textarea');const dec=h=>{d.innerHTML=h;return d.value};
  results=(j.items||[]).map(i=>({id:i.id.videoId,title:dec(i.snippet.title),author:dec(i.snippet.channelTitle).replace(/ - Topic$/,'')}));sel=0;render()}catch(e){msg('No connection. Check your network.')}}
let note='';function msg(t){note=t;render()}

/* ---------- Screens ---------- */
const S={
 menu:()=>({title:'Podium',items:[{l:'Music',c:1,go:'music'},{l:'Online',c:1,go:'online'},{l:'Library',c:1,go:'library'},{l:'Shuffle songs',a:()=>{if(queue.length){play(Math.floor(Math.random()*queue.length));stack=['menu','now'];render()}else msg('Add songs in Online first.')}},{l:'Now Playing',c:1,go:'now'},{l:'Settings',c:1,go:'settings'}]}),
 music:()=>({title:'Music',items:queue.map((t,i)=>({l:t.title,sub:t.author,a:()=>{play(i);stack.push('now');render()}})),empty:'No songs yet. Open Online and paste a YouTube Music link.'}),
 online:()=>({title:'Online',input:1,items:results.map(t=>({l:t.title,sub:t.author,a:()=>{addTrack(t);stack.push('now');render()}})),empty:'Search for a song, or paste a link from music.youtube.com.'}),
 settings:()=>({title:'Settings',items:[...extra(),{l:key?'Change API key':'Add API key',sub:key?'Search is on':'Needed for search',a:()=>{const k=prompt('YouTube Data API v3 key',key);if(k!==null){key=k.trim();store.set('pk',key);render()}}},{l:'Clear library',sub:queue.length+' songs',a:()=>{if(confirm('Remove all songs?')){queue=[];cur=-1;store.set('pq',[]);if(ready)player.stopVideo();paint();render()}}}]}),
 now:()=>({title:'Now Playing',now:1,items:[]})
};
function render(){const id=stack[stack.length-1],sc=S[id]();$('ttl').firstChild&&0;const L=$('logo');L.style.display=id==='menu'?'block':'none';let T=$('ttx');if(!T){T=document.createElement('span');T.id='ttx';$('ttl').appendChild(T)}T.textContent=id==='menu'?'':sc.title;
 $('inp').style.display=sc.input?'flex':'none';$('np').style.display=sc.now?'block':'none';$('list').style.display=sc.now?'none':'block';$('arc').style.display=id==='menu'?'block':'none';
 $('ytbox').style.cssText=sc.now?'position:absolute;left:50%;top:0;width:1px;height:1px;opacity:0':'';
 sel=Math.max(0,Math.min(sel,sc.items.length-1));
 const sub=id!=='menu';
 $('list').innerHTML=(sc.items.length?sc.items.map((it,i)=>{const off=id==='menu'?[0,40,70,90,100][i]||100:0;return`<div class="it${i===sel?' on':''}${sub?' sub':''}" data-i="${i}" tabindex="0" style="${id==='menu'&&i!==sel?'margin-left:'+off+'px':''}"><div class="t">${esc(it.l)}${it.sub?'<small>'+esc(it.sub)+'</small>':''}</div>${it.c?'<span class="chev">›</span>':''}</div>`}).join(''):`<div class="msg">${esc(note||sc.empty||'')}</div>`)+(sc.items.length&&note?`<div class="msg">${esc(note)}</div>`:'');
 note='';
 const on=$('list').querySelector('.on');if(on)on.scrollIntoView({block:'nearest'});$('body').style.overflowY=sub?'auto':'hidden';}
function pick(){clk();const sc=S[stack[stack.length-1]](),it=sc.items[sel];if(!it)return;if(it.go){stack.push(it.go);sel=0;render()}else if(it.a)it.a()}
function back(){clk();if(stack.length>1){stack.pop();sel=0;render()}}
function move(d){sel+=d;tk();render()}
$('list').onclick=e=>{const el=e.target.closest('.it');if(!el)return;sel=+el.dataset.i;render();pick()};
$('ctr').onclick=pick;$('bm').onclick=back;$('bpp').onclick=toggle;$('mp').onclick=toggle;$('mn').onclick=()=>next(1);$('bn').onclick=()=>next(1);$('bp').onclick=()=>next(-1);
$('pw').onclick=()=>{if(ready)player.pauseVideo()};
$('go').onclick=async()=>{const v=$('q').value.trim();if(!v)return;if(/^https?:/.test(v)){if(await addByLink(v)){$('q').value='';stack.push('now');render()}else msg('That link has no video ID.')}else search(v)};
$('q').onkeydown=e=>{if(e.key==='Enter')$('go').click();e.stopPropagation()};
document.onkeydown=e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowDown')move(1);else if(e.key==='ArrowUp')move(-1);else if(e.key==='Enter')pick();else if(e.key==='Escape')back();else if(e.key===' '){e.preventDefault();toggle()}};
/* click-wheel rotation */
(()=>{const r=$('ring');let last=null,acc=0;const ang=e=>{const b=r.getBoundingClientRect();return Math.atan2(e.clientY-b.top-b.height/2,e.clientX-b.left-b.width/2)*180/Math.PI};
 const inRing=e=>{const b=r.getBoundingClientRect(),d=Math.hypot(e.clientX-b.left-b.width/2,e.clientY-b.top-b.height/2);return d>66&&d<b.width/2&&!e.target.closest('button')};
 r.addEventListener('pointerdown',e=>{if(inRing(e)){last=ang(e);acc=0;r.setPointerCapture(e.pointerId)}});
 r.addEventListener('pointermove',e=>{if(last===null)return;const a=ang(e);let d=a-last;if(d>180)d-=360;if(d<-180)d+=360;last=a;acc+=d;while(Math.abs(acc)>=28){move(acc>0?1:-1);acc-=Math.sign(acc)*28}});
 const end=()=>last=null;r.addEventListener('pointerup',end);r.addEventListener('pointercancel',end);
 $('body').addEventListener('wheel',e=>{if(stack.length===1){e.preventDefault();move(e.deltaY>0?1:-1)}},{passive:false})})();
const tick=()=>{const d=new Date();$('clk').textContent=d.getHours()%12||12+':'+String(d.getMinutes()).padStart(2,'0');$('clk').textContent=(d.getHours()%12||12)+':'+String(d.getMinutes()).padStart(2,'0')};tick();setInterval(tick,15000);
/* ---------- Sound + haptics ---------- */
let pref=store.get('pp',{snd:1,hap:1}),AC=null;
function ctx(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function blip(f,d,v,type,t0){if(!pref.snd)return;const a=ctx();if(!a)return;const t=a.currentTime+(t0||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d)}
function hap(k){if(!pref.hap)return;try{const H=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Haptics;if(H)H.impact({style:k==='tick'?'LIGHT':k==='heavy'?'HEAVY':'MEDIUM'});else if(navigator.vibrate)navigator.vibrate(k==='tick'?6:k==='heavy'?40:18)}catch(e){}}
function tk(){blip(1800,.03,.07,'square');hap('tick')}
function clk(){blip(900,.06,.12,'triangle');hap('med')}
function startup(){[[392,0],[523,.12],[659,.24],[784,.36]].forEach(([f,t])=>blip(f,.9,.14,'sine',t));blip(1568,1.1,.05,'triangle',.5);blip(196,1.4,.1,'sine',0);hap('heavy')}
(function(){const b=$('boot');$('bl').src=$('logo').src;let done=false;
 const go=()=>{if(done)return;done=true;startup();setTimeout(()=>{b.style.opacity=0;setTimeout(()=>b.remove(),650)},1700)};
 ctx();setTimeout(()=>{if(AC&&AC.state==='running')go();else{b.classList.add('tap');b.addEventListener('pointerdown',go,{once:true})}},300)})();

/* ---------- Media session (lock screen / notification controls) ---------- */
function ms(){const t=queue[cur];if(!t||!('mediaSession' in navigator))return;try{const m=navigator.mediaSession;m.metadata=new MediaMetadata({title:t.title,artist:t.author,artwork:[{src:thumb(t.id).replace('mqdefault','hqdefault'),sizes:'480x360',type:'image/jpeg'}]});
 m.setActionHandler('play',()=>player.playVideo());m.setActionHandler('pause',()=>player.pauseVideo());m.setActionHandler('previoustrack',()=>next(-1));m.setActionHandler('nexttrack',()=>next(1))}catch(e){}}

/* ---------- YouTube account sync (OAuth device flow) ---------- */
let auth=store.get('pa',{}),pls=[];
const form=o=>Object.entries(o).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
async function post(u,o){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:form(o)});return r.json()}
async function signIn(){if(!auth.id||!auth.sec){msg('Add your Google client ID and secret first.');return}
 try{const d=await post('https://oauth2.googleapis.com/device/code',{client_id:auth.id,scope:'https://www.googleapis.com/auth/youtube.readonly'});
 if(!d.device_code){msg('Sign-in failed: '+(d.error_description||d.error));return}
 alert('Open '+d.verification_url+' and enter code: '+d.user_code);try{window.open(d.verification_url,'_system')}catch(e){}
 const end=Date.now()+d.expires_in*1000;
 while(Date.now()<end){await new Promise(r=>setTimeout(r,(d.interval||5)*1000));
  const t=await post('https://oauth2.googleapis.com/token',{client_id:auth.id,client_secret:auth.sec,device_code:d.device_code,grant_type:'urn:ietf:params:oauth:grant-type:device_code'});
  if(t.access_token){auth.tok=t.access_token;auth.ref=t.refresh_token;auth.exp=Date.now()+t.expires_in*1000-60000;store.set('pa',auth);hap('heavy');await syncLib();return}
  if(t.error&&t.error!=='authorization_pending'&&t.error!=='slow_down'){msg('Sign-in failed: '+t.error);return}}
 msg('Code expired. Try again.')}catch(e){msg('Sign-in failed. Check your connection.')}}
async function token(){if(auth.tok&&Date.now()<auth.exp)return auth.tok;if(!auth.ref)return null;
 try{const t=await post('https://oauth2.googleapis.com/token',{client_id:auth.id,client_secret:auth.sec,refresh_token:auth.ref,grant_type:'refresh_token'});
 if(t.access_token){auth.tok=t.access_token;auth.exp=Date.now()+t.expires_in*1000-60000;store.set('pa',auth);return auth.tok}}catch(e){}return null}
async function yt(path){const t=await token();if(!t)throw new Error('Sign in to YouTube in Settings first.');const r=await fetch('https://www.googleapis.com/youtube/v3/'+path,{headers:{Authorization:'Bearer '+t}});const j=await r.json();if(j.error)throw new Error(j.error.message);return j}
const mapV=i=>({id:(i.snippet.resourceId&&i.snippet.resourceId.videoId)||i.id,title:i.snippet.title,author:(i.snippet.videoOwnerChannelTitle||i.snippet.channelTitle||'').replace(/ - Topic$/,'')});
async function syncLib(){try{const j=await yt('playlists?part=snippet,contentDetails&mine=true&maxResults=50');pls=j.items.map(p=>({id:p.id,title:p.snippet.title,n:p.contentDetails.itemCount}));msg('Synced '+pls.length+' playlists.')}catch(e){msg(e.message)}}
async function loadLiked(){try{setQ((await yt('videos?part=snippet&myRating=like&maxResults=50')).items.map(mapV))}catch(e){msg(e.message)}}
async function loadPl(id){try{setQ((await yt('playlistItems?part=snippet&maxResults=50&playlistId='+id)).items.map(mapV).filter(t=>!/^(Private|Deleted) video$/.test(t.title)))}catch(e){msg(e.message)}}
function setQ(a){if(!a.length){msg('Nothing found.');return}queue=a;store.set('pq',queue);stack=['menu','now'];play(0);render()}
function ask(label,k){const v=prompt(label,auth[k]||'');if(v!==null){auth[k]=v.trim();store.set('pa',auth);render()}}
function extra(){const on=!!(auth.ref||auth.tok);return[
 {l:on?'Sync YouTube library':'Sign in to YouTube',sub:on?'Signed in':'Needs client ID and secret',a:()=>on?syncLib():signIn()},
 {l:'Google client ID',sub:auth.id?'Set':'Not set',a:()=>ask('Google OAuth client ID (TVs and limited input)','id')},
 {l:'Google client secret',sub:auth.sec?'Set':'Not set',a:()=>ask('Google OAuth client secret','sec')},
 {l:'Sign out',a:()=>{auth={id:auth.id,sec:auth.sec};store.set('pa',auth);pls=[];msg('Signed out.')}},
 {l:'Sound',sub:pref.snd?'On':'Off',a:()=>{pref.snd=pref.snd?0:1;store.set('pp',pref);render()}},
 {l:'Haptics',sub:pref.hap?'On':'Off',a:()=>{pref.hap=pref.hap?0:1;store.set('pp',pref);render()}}]}
S.library=()=>({title:'Library',items:[{l:'Liked songs',a:loadLiked},{l:'Playlists',c:1,go:'playlists'}]});
S.playlists=()=>({title:'Playlists',items:pls.map(p=>({l:p.title,sub:p.n+' tracks',a:()=>loadPl(p.id)})),empty:'No playlists yet. Sign in and sync in Settings.'});

if(queue.length){cur=0;paint()}render();
</script></body></html>
